name: Release

on:
  workflow_dispatch:
  push:
    branches: [dev, main]

permissions:
  contents: write
  packages: read
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Install release dependencies
        run: npm install
      - name: Semantic release
        id: release
        uses: cycjimmy/semantic-release-action@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MORPHE_SIGNING_KEY: ${{ secrets.MORPHE_SIGNING_KEY }}
      - name: Attest release bundle
        if: steps.release.outputs.new_release_published == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: Morphe Patches ${{ steps.release.outputs.new_release_git_tag }}
          subject-path: patches/build/libs/patches-*.mpp
