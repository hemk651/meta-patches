name: Release

# Semantic-release must not run concurrently for the same branch. Older runs
# are cancelled so the latest commit can be evaluated against the remote branch.
concurrency:
  group: semantic-release-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches: [dev, main]

permissions:
  contents: write
  packages: read
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Validate canonical MetaConfig payload and stage build asset
        run: |
          python3 scripts/validate_config.py
          install -D config/mc_overrides.json extensions/extension/src/main/assets/mc_overrides.json
          cmp config/mc_overrides.json extensions/extension/src/main/assets/mc_overrides.json
      - name: Build Morphe patch bundle before release
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid --no-daemon
      - name: Verify release bundle exists
        run: |
          test -n "$(find patches/build/libs -maxdepth 1 -type f -name '*.mpp' ! -name '*sources*' ! -name '*javadoc*' -print -quit)"
      - name: Install release dependencies
        run: npm install
      - name: Semantic release
        id: release
        uses: cycjimmy/semantic-release-action@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MORPHE_SIGNING_KEY: ${{ secrets.MORPHE_SIGNING_KEY }}
      - name: Attest release bundle
        if: steps.release.outputs.new_release_published == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: Morphe Patches ${{ steps.release.outputs.new_release_git_tag }}
          subject-path: patches/build/libs/patches-*.mpp
